<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/iconPng.png" id="favicon" />
    <link rel="apple-touch-icon" href="/iconPng.png" id="apple-touch-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">متجر إلكتروني</title>
    <meta name="description" content="متجرك الإلكتروني المتكامل" id="page-description" />
    <meta name="author" content="Store" />

    <meta property="og:title" content="متجر إلكتروني" id="og-title" />
    <meta property="og:description" content="متجرك الإلكتروني المتكامل" id="og-description" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/iconPng.png" id="og-image" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@store" />
    <meta name="twitter:image" content="/iconPng.png" id="twitter-image" />
    <!-- Performance: reduce connection setup time for API and image CDNs -->
    <link rel="dns-prefetch" href="http://localhost:4000" />
    <link rel="preconnect" href="http://localhost:4000" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous" />
      <script>
      (function () {
        function hexToRgb(hex) {
          var safe = String(hex || '').trim();
          if (!/^#([0-9a-fA-F]{6})$/.test(safe)) return null;
          var n = parseInt(safe.slice(1), 16);
          return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
        }
        try {
          var legacyCached = localStorage.getItem('theme_cache');
          var cached = localStorage.getItem('app-theme-data');
          var theme = legacyCached ? JSON.parse(legacyCached) : (cached ? JSON.parse(cached) : null);
          var primaryHex = (theme && theme.primaryColor) || '#111827';
          var secondaryHex = (theme && theme.secondaryColor) || '#374151';
          var p = hexToRgb(primaryHex) || { r: 17, g: 24, b: 39 };
          var s = hexToRgb(secondaryHex) || { r: 55, g: 65, b: 81 };
          var root = document.documentElement;
          var preBg = 'rgb(' + Math.round(p.r * 0.22) + ', ' + Math.round(p.g * 0.22) + ', ' + Math.round(p.b * 0.26) + ')';
          var preFg = 'rgb(255,255,255)';
          root.style.setProperty('--pre-bg', preBg);
          root.style.setProperty('--pre-fg', preFg);
          root.style.setProperty('--pre-primary', primaryHex);
          root.style.setProperty('--pre-secondary', secondaryHex);
          root.style.setProperty('--pre-primary-rgb', p.r + ' ' + p.g + ' ' + p.b);
          root.style.setProperty('--pre-secondary-rgb', s.r + ' ' + s.g + ' ' + s.b);
          var cachedLogoRaw = localStorage.getItem('cached_site_logo');
          var cachedLogo = cachedLogoRaw ? JSON.parse(cachedLogoRaw) : null;
          var logoUrl = (cachedLogo && cachedLogo.url) || '';
          window.__PRE_SPLASH_LOGO_URL = logoUrl;

          var favicon = document.getElementById('favicon');
          var appleIcon = document.getElementById('apple-touch-icon');
          var ogImage = document.getElementById('og-image');
          var twitterImage = document.getElementById('twitter-image');
          if (favicon && logoUrl) favicon.setAttribute('href', logoUrl);
          if (appleIcon && logoUrl) appleIcon.setAttribute('href', logoUrl);
          if (ogImage && logoUrl) ogImage.setAttribute('content', logoUrl);
          if (twitterImage && logoUrl) twitterImage.setAttribute('content', logoUrl);

          var cachedSiteName = localStorage.getItem('cached_site_name');
          if (cachedSiteName && cachedSiteName.trim()) {
            var siteName = cachedSiteName.trim();
            var titleEl = document.getElementById('page-title');
            var ogTitle = document.getElementById('og-title');
            if (titleEl) titleEl.textContent = siteName;
            if (ogTitle) ogTitle.setAttribute('content', siteName);
            document.title = siteName;
            window.__PRE_SPLASH_SITE_NAME = siteName;
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Static pre-React splash (single source loading screen) -->
    <div id="pre-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--pre-bg,#020617);z-index:9999;overflow:hidden">
      <div class="pre-bg-layer"></div>
      <div class="pre-blob pre-blob-primary"></div>
      <div class="pre-blob pre-blob-secondary"></div>

      <div class="pre-content">
        <div class="pre-orbital-wrap">
          <div class="pre-orbit pre-orbit-one"><span></span></div>
          <div class="pre-orbit pre-orbit-two"><span></span></div>
          <div class="pre-aura"></div>
          <div class="pre-logo-shell">
            <img src="" alt="Logo" id="splash-logo" />
            <div class="pre-logo-highlight"></div>
          </div>
        </div>

        <div class="pre-typography">
          <h2 id="splash-site-name">جاري التحميل</h2>
          <div class="pre-line"></div>
          <p>SYSTEM INITIALIZING</p>
          <div class="pre-progress">
            <div></div>
          </div>
        </div>
      </div>

      <div class="pre-footer">
        <span>Secure Console</span>
        <span class="dot"></span>
        <span>Operational Build</span>
      </div>
    </div>
    <script>
      (function () {
        var logoUrl = window.__PRE_SPLASH_LOGO_URL || '';
        var siteName = window.__PRE_SPLASH_SITE_NAME || '';
        var logoEl = document.getElementById('splash-logo');
        var nameEl = document.getElementById('splash-site-name');

        if (nameEl && siteName) nameEl.textContent = siteName;
        if (!logoEl) return;

        if (!logoUrl) {
          logoEl.style.display = 'none';
          return;
        }

        logoEl.onload = function () {
          logoEl.style.display = 'block';
        };
        logoEl.onerror = function () {
          logoEl.style.display = 'none';
        };
        logoEl.setAttribute('src', logoUrl);
      })();
    </script>
    <style>
      :root {
        --pre-bg: #0f172a;
        --pre-fg: #ffffff;
        --pre-primary: #111827;
        --pre-secondary: #374151;
        --pre-primary-rgb: 17 24 39;
        --pre-secondary-rgb: 55 65 81;
      }
      .pre-bg-layer {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, rgb(var(--pre-primary-rgb) / 0.08), transparent 45%),
          radial-gradient(circle at 75% 80%, rgb(var(--pre-secondary-rgb) / 0.08), transparent 45%);
      }
      .pre-blob {
        position: absolute;
        width: 60%;
        height: 60%;
        border-radius: 9999px;
        filter: blur(140px);
        opacity: 0.45;
        animation: pre-splash-blob 12s ease-in-out infinite;
      }
      .pre-blob-primary {
        left: -20%;
        top: -20%;
        background: rgb(var(--pre-primary-rgb) / 0.28);
      }
      .pre-blob-secondary {
        right: -20%;
        bottom: -20%;
        background: rgb(var(--pre-secondary-rgb) / 0.28);
        animation-delay: -5s;
      }
      .pre-content {
        position: relative;
        z-index: 10;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pre-orbital-wrap {
        position: relative;
        margin-bottom: 54px;
      }
      .pre-orbit {
        position: absolute;
        inset: -30px;
        border-radius: 9999px;
      }
      .pre-orbit span {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 9999px;
      }
      .pre-orbit-one {
        border: 1px solid rgb(var(--pre-primary-rgb) / 0.28);
        animation: pre-splash-spin 8s linear infinite;
      }
      .pre-orbit-one span {
        top: 0;
        width: 8px;
        height: 8px;
        background: rgb(var(--pre-primary-rgb));
        box-shadow: 0 0 12px rgb(var(--pre-primary-rgb) / 0.8);
      }
      .pre-orbit-two {
        border: 1px solid rgb(var(--pre-secondary-rgb) / 0.25);
        transform: scale(0.9);
        animation: pre-splash-spin-reverse 12s linear infinite;
      }
      .pre-orbit-two span {
        bottom: 0;
        width: 6px;
        height: 6px;
        background: rgb(var(--pre-secondary-rgb));
        box-shadow: 0 0 10px rgb(var(--pre-secondary-rgb) / 0.8);
      }
      .pre-aura {
        position: absolute;
        inset: -12px;
        border-radius: 9999px;
        background: rgb(var(--pre-primary-rgb) / 0.16);
        filter: blur(28px);
        animation: pre-splash-pulse 2s ease-in-out infinite;
      }
      .pre-logo-shell {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2.5rem;
        border: 1px solid rgb(255 255 255 / 0.2);
        background: rgb(255 255 255 / 0.06);
        backdrop-filter: blur(14px);
        box-shadow: 0 35px 60px -15px rgb(0 0 0 / 0.35);
      }
      #splash-logo {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        width: 96px;
        height: 96px;
        object-fit: contain;
        object-position: center;
        filter: drop-shadow(0 0 20px rgb(var(--pre-primary-rgb) / 0.65));
      }
      .pre-logo-highlight {
        position: absolute;
        inset: 0;
        z-index: 1;
        border-radius: 2.5rem;
        background: linear-gradient(135deg, rgb(255 255 255 / 0.12), transparent 45%);
      }
      .pre-typography h2 {
        margin: 0;
        color: var(--pre-fg, #fff);
        font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 0.18em;
      }
      .pre-line {
        width: 84px;
        height: 4px;
        margin: 12px auto 20px;
        border-radius: 9999px;
        background: linear-gradient(to right, transparent, rgb(var(--pre-primary-rgb) / 0.8), transparent);
      }
      .pre-typography p {
        margin: 0 0 12px;
        color: rgb(var(--pre-primary-rgb) / 0.65);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.42em;
      }
      .pre-progress {
        width: 256px;
        height: 2px;
        background: rgb(255 255 255 / 0.14);
        border-radius: 9999px;
        overflow: hidden;
      }
      .pre-progress div {
        width: 66%;
        height: 100%;
        border-radius: 9999px;
        background: rgb(var(--pre-primary-rgb));
        box-shadow: 0 0 15px rgb(var(--pre-primary-rgb) / 0.75);
        animation: pre-splash-progress 2.5s ease-in-out infinite;
      }
      .pre-footer {
        position: fixed;
        bottom: 48px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        color: rgb(255 255 255 / 0.46);
        font-size: 9px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }
      .pre-footer .dot {
        width: 4px;
        height: 4px;
        border-radius: 9999px;
        background: rgb(var(--pre-primary-rgb));
      }
      @keyframes pre-splash-spin { to { transform: rotate(360deg); } }
      @keyframes pre-splash-spin-reverse { to { transform: scale(0.9) rotate(-360deg); } }
      @keyframes pre-splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.07); opacity: 1; } }
      @keyframes pre-splash-progress { 0%, 100% { transform: translateX(-20%); } 50% { transform: translateX(32%); } }
      @keyframes pre-splash-blob { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(22px,-18px); } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
